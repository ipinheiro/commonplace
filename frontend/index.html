<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3ec" />
    <meta name="description" content="A private place for things worth keeping." />
    <meta name="apple-mobile-web-app-title" content="Commonplace" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Font link and theme boot. Goes at the top of every page, before the
     stylesheet. The boot script runs before any content paints: it stamps a
     saved choice onto <html> and otherwise leaves the document un-stamped so
     the claude.ai host or the operating system decides. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..700&display=swap"
    />
    <script>
      (function () {
        let saved = null;
        try {
          saved = localStorage.getItem('dsa-theme');
        } catch (e) {}
        if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
      })();
    </script>

    <title>Commonplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
